[project]
name = "multi-agent-chat"
version = "0.1.0"
description = ""
authors = [
    {name = "GabrielFJanu",email = "gabrielfjanu@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi[standard] (>=0.143.0,<0.144.0)",
    "sqlalchemy (>=2.1.4,<3.0.0)"
]

[tool.poetry]
packages = [{include = "multi_agent_chat", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "ruff (>=0.17.0,<0.18.0)"
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest.ini_options]
pythonpath = "src"
addopts = '-p no:warnings'

[tool.taskipy.tasks]
lint = 'ruff check'
pre_format = 'ruff check --fix'
format = 'ruff format'
run = 'fastapi dev src/multi_agent_chat/app.py'
pre_test = 'task lint'
test = 'pytest -s -x --cov=src/multi_agent_chat -vv'
post_test = 'coverage html'
